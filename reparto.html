<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pannello Reparti - Unieuro RC</title>
  <style>
    :root {
      --unieuro-blue: #002D62;
      --unieuro-orange: #FF6700;
      --bg: #F0F3F9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: var(--bg); padding: 15px; color: #1E293B; }
    header {
      background: linear-gradient(135deg, #001F4D, var(--unieuro-blue));
      color: white;
      padding: 16px 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    header h1 { font-size: 1.2rem; }
    .btn-back {
      background: rgba(255,255,255,0.2);
      color: white;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .toolbar {
      background: white;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    select {
      flex: 1;
      min-width: 220px;
      padding: 10px;
      border-radius: 8px;
      border: 1.5px solid #CBD5E1;
      font-size: 0.95rem;
    }
    .req-list { display: grid; gap: 12px; }
    .req-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border-left: 6px solid var(--unieuro-orange);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .req-card.gestita { border-left-color: #16A34A; opacity: 0.75; }
    .req-info h3 { color: var(--unieuro-blue); font-size: 1.1rem; margin-bottom: 4px; }
    .req-meta { font-size: 0.85rem; color: #64748B; }
    .req-actions { display: flex; gap: 8px; }
    .btn-action {
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-complete { background: #16A34A; color: white; }
    .empty-msg {
      text-align: center;
      background: white;
      padding: 30px;
      border-radius: 12px;
      color: #64748B;
    }
  </style>
</head>
<body>

  <header>
    <h1>🏢 Richieste Reparti</h1>
    <a href="index.html" class="btn-back">⬅ Torna alla Home</a>
  </header>

  <div class="toolbar">
    <select id="filtroReparto" onchange="renderRichieste()">
      <option value="TUTTI">Tutti i Reparti</option>
      <option value="Grandi Elettrodomestici (GED)">🧺 Grandi Elettrodomestici (GED)</option>
      <option value="Piccoli Elettrodomestici (PED)">☕ Piccoli Elettrodomestici (PED)</option>
      <option value="TV & Home Cinema">📺 TV & Home Cinema</option>
      <option value="Telefonia & Wearable">📱 Telefonia & Wearable</option>
      <option value="Informatica & Tablet">💻 Informatica & Tablet</option>
      <option value="Gaming & Console">🎮 Gaming & Console</option>
      <option value="Climatizzazione">❄️ Climatizzazione</option>
    </select>
  </div>

  <div id="listaContainer" class="req-list"></div>

  <script>
    const REQUESTS_STORAGE_KEY = 'unieuro_requests_db';

    function getRichieste() {
      try {
        return JSON.parse(localStorage.getItem(REQUESTS_STORAGE_KEY) || '[]');
      } catch (e) {
        return [];
      }
    }

    function segnaCompletata(id) {
      const lista = getRichieste().map(item => {
        if (item.id === id) item.stato = 'Completata';
        return item;
      });
      localStorage.setItem(REQUESTS_STORAGE_KEY, JSON.stringify(lista));
      renderRichieste();
    }

    function renderRichieste() {
      const filtro = document.getElementById('filtroReparto').value;
      const container = document.getElementById('listaContainer');
      const tutte = getRichieste();

      const filtrate = filtro === 'TUTTI'
        ? tutte
        : tutte.filter(r => r.reparto === filtro);

      if (filtrate.length === 0) {
        container.innerHTML = '<div class="empty-msg">Nessuna richiesta presente per questo reparto.</div>';
        return;
      }

      container.innerHTML = filtrate.map(r => `
        <div class="req-card ${r.stato === 'Completata' ? 'gestita' : ''}">
          <div class="req-info">
            <h3>🔎 ${r.prodotto}</h3>
            <div class="req-meta">
              <strong>Reparto:</strong> ${r.reparto} | 
              <strong>Cliente:</strong> ${r.cliente} | 
              <strong>Ora:</strong> ${r.orario} (${r.stato})
            </div>
          </div>
          <div class="req-actions">
            ${r.stato !== 'Completata'
              ? `<button class="btn-action btn-complete" onclick="segnaCompletata(${r.id})">✔ Completata</button>`
              : `<span style="color:#16A34A; font-weight:700;">✔ Gestita</span>`
            }
          </div>
        </div>
      `).join('');
    }

    // Aggiornamento automatico se arrivano nuove richieste
    window.addEventListener('storage', renderRichieste);
    window.addEventListener('DOMContentLoaded', () => {
      // Azzera sempre il filtro su "TUTTI" all'apertura
      document.getElementById('filtroReparto').selectedIndex = 0;
      renderRichieste();
    });
  </script>
</body>
</html>
