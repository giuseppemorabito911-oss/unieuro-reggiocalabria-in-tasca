<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pannello Interventi Reparto - Unieuro RC</title>
  <style>
    :root {
      --unieuro-blue: #002D62;
      --unieuro-orange: #FF6700;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #EEF2F7; padding: 16px; color: #1E293B; }
    header {
      background: linear-gradient(135deg, #001838, var(--unieuro-blue));
      color: white;
      padding: 16px 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .toolbar {
      background: white;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 16px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    select, input, textarea {
      padding: 10px;
      border-radius: 8px;
      border: 1.5px solid #CBD5E1;
      font-size: 0.95rem;
      width: 100%;
    }
    /* Singolo pannellino intervento */
    .intervento-card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
      border-top: 5px solid var(--unieuro-orange);
      border-left: 5px solid var(--unieuro-blue);
    }
    .badge-reparto {
      background: var(--unieuro-blue);
      color: white;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
    }
    .badge-interno {
      background: #7C3AED;
      color: white;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 800;
      display: inline-block;
      margin-left: 6px;
    }
    .btn {
      background: var(--unieuro-blue);
      color: white;
      border: none;
      padding: 11px 16px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      font-size: 0.92rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-green { background: #16A34A; width: 100%; margin-top: 10px; }
    .btn-call {
      background: #0284C7;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 800;
      display: inline-block;
    }
    .crop-img {
      max-width: 220px;
      border-radius: 8px;
      border: 2px solid var(--unieuro-orange);
      margin-top: 10px;
      display: block;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h2>🛠️ Pannellini Intervento Reparto</h2>
      <small style="color:#CBD5E1;">Gestione rapida singole richieste aperte</small>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <a href="interno.html" class="btn" style="background:#7C3AED; padding:9px 14px; font-size:0.85rem;">📞 + Richiesta Interna</a>
      <button class="btn" style="background:var(--unieuro-orange); padding:9px 14px; font-size:0.85rem;" onclick="caricaDatiReparto()">🔄 Aggiorna</button>
    </div>
  </header>

  <div class="toolbar">
    <select id="filtroReparto" onchange="renderizzaPannellini()" style="flex:1; min-width:220px;">
      <option value="TUTTI">📋 Tutti i Reparti (Richieste Aperte)</option>
      <option value="GRANDI ELETTRODOMESTICI">🧺 GRANDI ELETTRODOMESTICI</option>
      <option value="PICCOLI ELETTRODOMESTICI">☕ PICCOLI ELETTRODOMESTICI</option>
      <option value="TELEFONIA">📱 TELEFONIA</option>
      <option value="TV">📺 TV</option>
      <option value="INFORMATICA">💻 INFORMATICA</option>
      <option value="ASSISTENZA">🛠️ ASSISTENZA</option>
      <option value="RITIRO RAEE">♻️ RITIRO RAEE</option>
    </select>
  </div>

  <div id="containerPannellini">Caricamento richieste in corso...</div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzCQYZvPF9TKwLqozpHQMDvM2_i1MG-J9UHKsVxdDTmLnukWua_5tmcv65UlSifCB0D/exec";
    const NTFY_TOPIC = 'unieuro_reggio_calabria_reparti_live';
    const REQ_KEY = 'unieuro_requests_db';
    const OPERATORI_STAFF = ["PEPPE M.", "DAGO", "DANIELE", "GIORGIO", "PAOLO", "MIMMO", "OUSMANE"];

    let mappaRichieste = new Map();

    function preparaNumero7Collaboration(num) {
      if (!num) return "";
      let clean = String(num).replace(/[\s\-\.\(\)']+/g, '').replace(/^(\+39|0039)/, '');
      if (!clean) return "";
      if (!clean.startsWith('0')) clean = '0' + clean;
      return clean;
    }

    function normalizza(p) {
      if (!p) return null;
      const id = String(p.id || p['ID Pratica'] || '').trim();
      if (!id) return null;
      return {
        id: id,
        timestamp: p.timestamp || p['Data e Ora'] || '',
        reparto: String(p.reparto || p['Reparto'] || '').toUpperCase().trim(),
        tipoRichiesta: p.tipoRichiesta || p['Tipo Richiesta'] || '',
        nomeCliente: p.nomeCliente || p['Nome Cliente'] || '',
        telefono: p.telefono || p['Telefono'] || '',
        emailCliente: p.emailCliente || p['Email Cliente'] || '',
        preferenzaContatto: p.preferenzaContatto || p['Preferenza Contatto'] || '',
        noteCliente: p.noteCliente || p['Dettagli / Note Cliente'] || '',
        stato: p.stato || p['Stato'] || 'Aperta',
        noteRepartista: p.noteRepartista || p['Note Repartista'] || '',
        operatore: p.operatore || p['Operatore'] || '',
        image: p.image || p['Immagine / Offerta (Base64)'] || ''
      };
    }

    function unisciRecord(raw) {
      if (!raw) return;
      if (raw.action === 'update' && raw.id) {
        const rec = mappaRichieste.get(String(raw.id));
        if (rec) {
          if (raw.stato) rec.stato = raw.stato;
          if (raw.operatore !== undefined) rec.operatore = raw.operatore;
          if (raw.noteRepartista !== undefined) rec.noteRepartista = raw.noteRepartista;
          mappaRichieste.set(String(raw.id), rec);
        }
        return;
      }
      const norm = normalizza(raw);
      if (!norm) return;
      mappaRichieste.set(norm.id, norm);
    }

    function leggiParametroUrl() {
      const params = new URLSearchParams(window.location.search);
      const rep = params.get('reparto');
      if (rep) {
        const sel = document.getElementById('filtroReparto');
        const repClean = rep.toUpperCase().trim();
        for (let opt of sel.options) {
          if (opt.value.toUpperCase().includes(repClean) || repClean.includes(opt.value.toUpperCase())) {
            sel.value = opt.value;
            break;
          }
        }
      }
    }

    async function caricaDatiReparto() {
      try {
        const res = await fetch(`${SCRIPT_URL}?action=get`, { redirect: 'follow' });
        const json = await res.json();
        const daSheet = Array.isArray(json) ? json : (json.data || []);
        daSheet.forEach(item => unisciRecord(item));
      } catch (e) {}

      try {
        const resNtfy = await fetch(`https://ntfy.sh/${NTFY_TOPIC}/json?poll=1&since=48h`);
        const txt = await resNtfy.text();
        txt.trim().split('\n').forEach(line => {
          if (!line) return;
          try {
            const ev = JSON.parse(line);
            if (ev.event === 'message' && ev.message) {
              unisciRecord(JSON.parse(ev.message));
            }
          } catch (e) {}
        });
      } catch (e) {}

      try {
        const cache = JSON.parse(localStorage.getItem(REQ_KEY) || '[]');
        cache.forEach(p => unisciRecord(p));
      } catch (e) {}

      renderizzaPannellini();
    }

    function renderizzaPannellini() {
      const filtroRep = document.getElementById('filtroReparto').value.toUpperCase().trim();
      const container = document.getElementById('containerPannellini');
      
      // Mostra solo le richieste ancora APERTE per i reparti
      const aperte = Array.from(mappaRichieste.values())
        .filter(x => x.stato === 'Aperta')
        .reverse();

      const lista = filtroRep === 'TUTTI'
        ? aperte
        : aperte.filter(x => x.reparto.includes(filtroRep) || filtroRep.includes(x.reparto));

      if (lista.length === 0) {
        container.innerHTML = '<div style="background:white; padding:30px; border-radius:12px; text-align:center; font-weight:700; color:#64748B;">🎉 Ottimo lavoro! Nessuna richiesta aperta al momento.</div>';
        return;
      }

      container.innerHTML = lista.map(p => {
        const tel7Collab = preparaNumero7Collaboration(p.telefono);
        const isInterno = p.id.startsWith('INT-') || p.tipoRichiesta.includes('INTERNO');

        const opzioniOperatore = [
          `<option value="">-- Seleziona il tuo nome --</option>`,
          ...OPERATORI_STAFF.map(op => `<option value="${op}" ${p.operatore === op ? 'selected' : ''}>${op}</option>`)
        ].join('');

        return `
          <div class="intervento-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:6px;">
              <div>
                <span class="badge-reparto">${p.reparto}</span>
                ${isInterno ? `<span class="badge-interno">📞 DA INTERNO</span>` : ''}
              </div>
              <small style="color:#64748B; font-weight:700;">ID: ${p.id} • 🕒 ${p.timestamp}</small>
            </div>

            <div style="background:#F8FAFC; padding:12px; border-radius:10px; margin-bottom:12px;">
              <div style="font-size:1rem; font-weight:800; color:var(--unieuro-blue); margin-bottom:4px;">
                👤 ${p.nomeCliente}
              </div>
              <div style="font-size:0.9rem; color:#334155; margin-bottom:8px;">
                📝 <strong>Richiesta:</strong> ${p.noteCliente}
              </div>
              <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
                <span>📌 Ricontatto: <strong>${p.preferenzaContatto}</strong></span>
                ${tel7Collab ? `<a href="tel:${tel7Collab}" class="btn-call">📞 Chiama ${tel7Collab} (7Collab)</a>` : ''}
                ${p.emailCliente ? `<a href="mailto:${p.emailCliente}" style="color:var(--unieuro-blue); font-weight:700;">✉️ ${p.emailCliente}</a>` : ''}
              </div>
            </div>

            ${p.image && p.image.startsWith('data:image') ? `<img src="${p.image}" class="crop-img" onclick="window.open(this.src)">` : ''}

            <!-- Pannellino singolo di compilazione intervento -->
            <div style="margin-top:12px; border-top:2px dashed #E2E8F0; padding-top:12px;">
              <div class="grid-2" style="display:grid; grid-template-columns: 1fr 2fr; gap:10px; margin-bottom:10px;">
                <div>
                  <label style="font-size:0.8rem; font-weight:700; color:#475569; display:block; margin-bottom:4px;">Operatore *</label>
                  <select id="operatore_${p.id}" style="font-weight:700;">
                    ${opzioniOperatore}
                  </select>
                </div>
                <div>
                  <label style="font-size:0.8rem; font-weight:700; color:#475569; display:block; margin-bottom:4px;">Intervento Svolto / Note *</label>
                  <input type="text" id="noteRep_${p.id}" value="${p.noteRepartista}" placeholder="Es. Contattato cliente, prodotto ordinato...">
                </div>
              </div>
              <button class="btn btn-green" onclick="inviaIntervento('${p.id}')">
                ✔ Registra Intervento e Chiudi Pratica
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function inviaIntervento(id) {
      const operatoreEl = document.getElementById(`operatore_${id}`);
      const noteEl = document.getElementById(`noteRep_${id}`);

      if (!operatoreEl.value) {
        alert("Seleziona il nome dell'operatore prima di inviare.");
        operatoreEl.focus();
        return;
      }
      if (!noteEl.value.trim()) {
        alert("Inserisci i dettagli dell'intervento svolto.");
        noteEl.focus();
        return;
      }

      const updatePayload = {
        action: "update",
        id: id,
        stato: "Gestita",
        operatore: operatoreEl.value.trim(),
        noteRepartista: noteEl.value.trim()
      };

      // Rimuove subito la scheda dalla vista corrente del reparto
      mappaRichieste.delete(id);
      try {
        localStorage.setItem(REQ_KEY, JSON.stringify(Array.from(mappaRichieste.values()).slice(0, 80)));
      } catch (e) {}
      renderizzaPannellini();

      // Propaga la chiusura in tempo reale su admin e cloud
      fetch(`https://ntfy.sh/${NTFY_TOPIC}`, {
        method: 'POST',
        body: JSON.stringify(updatePayload)
      }).catch(() => {});

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(updatePayload)
      }).catch(() => {});
    }

    window.addEventListener('DOMContentLoaded', () => {
      leggiParametroUrl();
      caricaDatiReparto();

      try {
        const sse = new EventSource(`https://ntfy.sh/${NTFY_TOPIC}/sse`);
        sse.onmessage = (e) => {
          try {
            const msg = JSON.parse(e.data);
            if (msg.message) {
              unisciRecord(JSON.parse(msg.message));
              renderizzaPannellini();
            }
          } catch (err) {}
        };
      } catch (e) {}
    });
  </script>
</body>
</html>
