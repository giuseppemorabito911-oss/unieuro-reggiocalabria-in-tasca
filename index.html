<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Unieuro Reggio Calabria in Tasca</title>
  
  <!-- Manifest e PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icona.png">
  <meta name="theme-color" content="#003399">

  <!-- PRELOAD & PREFETCH PER MASSIMA VELOCITÀ DI APERTURA -->
  <link rel="prefetch" href="reparto.html" as="document">
  <link rel="prefetch" href="admin.html" as="document">
  <link rel="preload" href="volantino.pdf" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="promo.pdf" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="icona.png" as="image">

  <style>
    /* STILI BASE E OTTIMIZZAZIONE INTERFACCIA */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 20px;
    }

    header {
      background-color: #003399;
      color: #fff;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header img {
      max-height: 40px;
      margin-bottom: 5px;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    main {
      padding: 15px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .card h2 {
      font-size: 1.1rem;
      color: #003399;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* BARRA DI RICERCA PRODOTTO / VOLANTINO */
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .search-box input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: #003399;
    }

    .btn {
      background-color: #003399;
      color: #fff;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      transition: background 0.2s ease;
    }

    .btn:active {
      background-color: #002266;
    }

    .btn-block {
      width: 100%;
    }

    .btn-outline {
      background: transparent;
      color: #003399;
      border: 2px solid #003399;
    }

    /* SEZIONE TESSERA UNIEURO */
    .tessera-card {
      background: linear-gradient(135deg, #003399, #001f66);
      color: #fff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 10px rgba(0,51,153,0.3);
      margin-bottom: 15px;
    }

    .tessera-card h2 {
      color: #fff;
    }

    .tessera-input-group {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .tessera-input-group input {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .tessera-saved-info {
      margin-top: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.2);
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      word-break: break-all;
    }

    /* GRIGLIA NAVIGAZIONE RAPIDA */
    .grid-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    footer {
      text-align: center;
      font-size: 0.85rem;
      color: #777;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <header>
    <img src="icona.png" alt="Unieuro Logo" id="appLogo">
    <h1>Reggio Calabria in Tasca</h1>
  </header>

  <main>
    
    <!-- CARD TESSERA CLUB UNIEURO (SEMPRE CONSERVATA) -->
    <div class="tessera-card">
      <h2>💳 La Tua Tessera Unieuro</h2>
      <div id="tesseraBox">
        <div class="tessera-input-group">
          <input type="text" id="numeroTessera" class="tessera-input" placeholder="Inserisci il numero di tessera">
          <button class="btn" onclick="salvaTessera()" style="background:#ff6600;">Salva</button>
        </div>
      </div>
      <div id="tesseraDisplay" style="display:none;">
        <div class="tessera-saved-info" id="tesseraCodice"></div>
        <button class="btn btn-outline" onclick="modificaTessera()" style="color:#fff; border-color:#fff; margin-top:8px; width:100%;">Modifica codice</button>
      </div>
    </div>

    <!-- RICERCA VELOCE PRODOTTO / REPARTO -->
    <div class="card">
      <h2>🔍 Cerca o Richiedi Prodotto</h2>
      <div class="search-box">
        <input type="text" id="searchQuery" placeholder="Es. Lavatrice, TV, Smartphone..." autocomplete="off">
        <button class="btn" onclick="inviaRichiestaPWA()">Cerca</button>
      </div>
    </div>

    <!-- NAVIGAZIONE RAPIDA AI REPARTI E PANNELLI -->
    <div class="grid-nav">
      <a href="reparto.html" class="btn btn-block" style="background:#003399;">
        🏢 Reparti & Promo
      </a>
      <a href="admin.html" class="btn btn-block btn-outline">
        ⚙️ Area Admin
      </a>
    </div>

  </main>

  <footer>
    <p>Unieuro Reggio Calabria in Tasca &copy; 2026</p>
  </footer>

  <!-- LOGICA JAVASCRIPT OTTIMIZZATA -->
  <script>
    // ----------------------------------------------------
    // 1. GESTIONE TESSERA UNIEURO (localStorage)
    // ----------------------------------------------------
    function caricaTessera() {
      const tesseraSalvata = localStorage.getItem('unieuro_tessera_code');
      if (tesseraSalvata) {
        document.getElementById('tesseraCodice').innerText = 'Codice: ' + tesseraSalvata;
        document.getElementById('tesseraBox').style.display = 'none';
        document.getElementById('tesseraDisplay').style.display = 'block';
      } else {
        document.getElementById('tesseraBox').style.display = 'flex';
        document.getElementById('tesseraDisplay').style.display = 'none';
      }
    }

    function salvaTessera() {
      const input = document.getElementById('numeroTessera');
      const val = input.value.trim();
      if (val) {
        localStorage.setItem('unieuro_tessera_code', val);
        caricaTessera();
      }
    }

    function modificaTessera() {
      document.getElementById('tesseraBox').style.display = 'flex';
      document.getElementById('tesseraDisplay').style.display = 'none';
    }

    // ----------------------------------------------------
    // 2. RESET AUTOMATICO DELLE RICERCHE (30 SEC INATTIVITÀ)
    // ----------------------------------------------------
    function resetSearchForms() {
      const searchInputs = document.querySelectorAll('input[type="text"], input[type="search"]');
      searchInputs.forEach(input => {
        // NON cancella il campo della tessera Unieuro
        if (!input.classList.contains('tessera-input') && input.id !== 'numeroTessera') {
          input.value = '';
        }
      });
    }

    let inactivityTimer;
    function resetInactivityTimer() {
      clearTimeout(inactivityTimer);
      // Reset dei campi ricerca dopo 30 secondi di inattività
      inactivityTimer = setTimeout(() => {
        resetSearchForms();
      }, 30000);
    }

    // Ascolta i tocchi e le interazioni dell'utente per azzerare il timer
    ['click', 'touchstart', 'mousemove', 'keydown', 'scroll'].forEach(eventName => {
      document.addEventListener(eventName, resetInactivityTimer, true);
    });

    // ----------------------------------------------------
    // 3. INVIO RICHIESTA PRODOTTO
    // ----------------------------------------------------
    function inviaRichiestaPWA() {
      const query = document.getElementById('searchQuery').value.trim();
      if (!query) return;

      // Invia direttamente la ricerca alla pagina reparti senza blocchi
      window.location.href = `reparto.html?search=${encodeURIComponent(query)}`;
    }

    // ----------------------------------------------------
    // INIZIALIZZAZIONE ALL'APERTURA DELLA PAGINA
    // ----------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      caricaTessera();
      resetSearchForms();
      resetInactivityTimer();
    });
  </script>
</body>
</html>
